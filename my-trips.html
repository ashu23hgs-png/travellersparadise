<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Trips - Traveller's Paradise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="ChatGPT Image May 16, 2026, 08_23_41 PM.png">
  <style>
    :root {
      --bg: #080810;
      --surface: rgba(255, 255, 255, 0.04);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f2ede6;
      --muted: rgba(242, 237, 230, 0.68);
      --accent: #e8c87a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Outfit', sans-serif;
      background: radial-gradient(circle at top, #12121e 0%, var(--bg) 45%);
      color: var(--text);
      min-height: 100vh;
      padding: 40px 20px 80px;
      line-height: 1.7;
    }

    .app { max-width: 960px; margin: 0 auto; }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 32px;
    }

    .logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2rem, 4vw, 3.2rem);
      letter-spacing: 0.3px;
    }

    .logo span { color: var(--accent); }

    .back-button {
      color: var(--text);
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      font-size: 14px;
      transition: all 0.18s ease;
      white-space: nowrap;
    }

    .back-button:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 28px;
      border-radius: 16px;
      color: var(--muted);
    }

    @media (max-width: 640px) {
      body { padding: 24px 14px 48px; }
      .header { align-items: flex-start; flex-direction: column; }
      .card { padding: 22px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="logo">Traveller's <span>Paradise</span></div>
      <a class="back-button" href="index.html">Back to Home</a>
    </header>

    <div class="card">
      <h1 style="margin:0 0 10px; font-family:'Cormorant Garamond', serif; color: var(--text);">My Trips</h1>
      <p style="margin:0;">This page is coming soon. Your planned trips will appear here.</p>
    </div>
  </div>
</body>
</html>
