    <style>
        :root {
            --bg: #080810;
            --surface: rgba(255, 255, 255, 0.04);
            --surface-2: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
            --text: #f2ede6;
            --muted: rgba(242, 237, 230, 0.68);
            --accent: #e8c87a;
            --accent-2: #cda95c;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at top, #12121e 0%, var(--bg) 45%);
            color: var(--text);
            padding: 40px 20px 60px;
        }

        .app {
            max-width: 960px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 32px;
        }

        .back-button,
        .action-button {
            color: var(--text);
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.14);
            padding: 10px 16px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.04);
            font-size: 14px;
            transition: background 0.18s ease, border-color 0.18s ease, transform 0.18s ease, opacity 0.18s ease;
            cursor: pointer;
        }

        .back-button:hover,
        .action-button:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(232, 200, 122, 0.45);
            transform: translateY(-1px);
        }

        .back-button:disabled,
        .action-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2rem, 4vw, 3.2rem);
            letter-spacing: 0.3px;
            line-height: 1;
        }

        .title {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2.5rem, 4vw, 4rem);
            margin: 0 0 10px;
        }

        .subtitle {
            color: var(--muted);
            margin: 0 0 12px;
            line-height: 1.6;
        }

        .ai-note {
            margin: 0 0 22px;
            color: var(--accent);
            font-size: 14px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 0 0 28px;
        }

        .day-card,
        .map-card,
        .cost-box {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 12px;
            backdrop-filter: blur(8px);
        }

        .day-card {
            margin-bottom: 20px;
        }

        .day-title {
            font-size: 18px;
            color: var(--accent);
            margin-bottom: 15px;
            font-weight: 500;
        }

        .timeline {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .time-block {
            display: flex;
            gap: 12px;
            align-items: center;
            background: var(--surface-2);
            padding: 10px;
            border-left: 2px solid var(--accent);
            border-radius: 6px;
        }

        .time-label {
            font-size: 12px;
            color: var(--accent);
            width: 92px;
            flex-shrink: 0;
            font-weight: 500;
        }

        .place-card {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            width: 100%;
        }

        .place-card img {
            width: 96px;
            height: 72px;
            object-fit: cover;
            border-radius: 6px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.08);
        }

        .place-copy {
            min-width: 0;
        }

        .place-name {
            font-size: 14px;
            line-height: 1.5;
        }

        .place-tag {
            margin-top: 4px;
            display: inline-block;
            font-size: 11px;
            color: var(--muted);
        }

        .cost-box {
            margin-top: 30px;
            line-height: 1.7;
        }

        .notice {
            margin: 18px 0 0;
            color: var(--muted);
            font-size: 14px;
        }

        .map-wrap {
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            border: 1px solid var(--border);
            aspect-ratio: 16 / 9;
            background: #111;
        }

        .map-wrap iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .section-label {
            font-size: 18px;
            color: var(--accent);
            margin: 0 0 14px;
        }

        .error-box {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 22px;
            max-width: 680px;
            margin: 60px auto;
        }

        .trip-error-banner {
            display: none;
            margin: 0 0 22px;
            padding: 16px 18px;
            border-radius: 14px;
            border: 1px solid rgba(255, 120, 120, 0.35);
            background: rgba(255, 80, 80, 0.08);
            color: #ffd8d8;
            line-height: 1.55;
            font-size: 14px;
        }

        .trip-error-banner.visible {
            display: block;
        }

        .trip-error-banner strong {
            color: #ffb4b4;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Loading states */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at top, #12121e 0%, var(--bg) 45%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            color: var(--text);
        }

        .loading-message {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 40px;
            text-align: center;
            color: var(--accent);
        }

        .loading-spinner-large {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(232, 200, 122, 0.3);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        .shimmer-cards {
            display: grid;
            gap: 20px;
            max-width: 800px;
            width: 100%;
            padding: 0 20px;
        }

        .shimmer-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            animation: shimmer 2s infinite linear;
        }

        .shimmer-card-header {
            height: 24px;
            background: linear-gradient(90deg, var(--surface-2) 25%, rgba(255,255,255,0.1) 50%, var(--surface-2) 75%);
            background-size: 200% 100%;
            border-radius: 4px;
            margin-bottom: 16px;
        }

        .shimmer-timeline {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .shimmer-time-block {
            display: flex;
            gap: 12px;
            align-items: center;
            background: var(--surface-2);
            padding: 10px;
            border-left: 2px solid var(--accent);
            border-radius: 6px;
        }

        .shimmer-time-label {
            width: 92px;
            height: 16px;
            background: linear-gradient(90deg, var(--surface-2) 25%, rgba(255,255,255,0.1) 50%, var(--surface-2) 75%);
            background-size: 200% 100%;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .shimmer-place-card {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .shimmer-image {
            width: 96px;
            height: 72px;
            background: linear-gradient(90deg, var(--surface-2) 25%, rgba(255,255,255,0.1) 50%, var(--surface-2) 75%);
            background-size: 200% 100%;
            border-radius: 6px;
            flex-shrink: 0;
        }

        .shimmer-text {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .shimmer-line {
            height: 14px;
            background: linear-gradient(90deg, var(--surface-2) 25%, rgba(255,255,255,0.1) 50%, var(--surface-2) 75%);
            background-size: 200% 100%;
            border-radius: 4px;
        }

        .shimmer-line.short {
            width: 60%;
        }

        @keyframes shimmer {
            0% {
                background-position: -200% 0;
            }
            100% {
                background-position: 200% 0;
            }
        }

        .hidden {
            display: none !important;
        }

	        @media (max-width: 640px) {
	            body {
	                padding: 24px 14px 48px;
	            }
	
	            .header {
	                align-items: flex-start;
	                flex-direction: column;
	            }

            .toolbar {
                flex-direction: column;
            }

            .toolbar .action-button,
            .toolbar .back-button {
                width: 100%;
                text-align: center;
            }

            .time-block {
                align-items: flex-start;
                flex-direction: column;
            }

            .time-label {
                width: auto;
            }

            .place-card {
                width: 100%;
            }

            .place-card img {
                width: 84px;
                height: 64px;
            }
        }
    
        @media print {
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            body {
                background: #080810 !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                margin: 0;
                padding: 0;
            }
            .app {
                background: #080810 !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .day-card, .map-card, .cost-box {
                background: rgba(255, 255, 255, 0.04) !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }

        .pdf-mode-body {
            background: #080810 !important;
        }

        .pdf-mode-body .app {
            background: #080810 !important;
        }

    </style>
</head>

    <div class="app" id="pdfContent">
        <div class="header">
            <div class="logo">
                Traveller's <span style="color: #e8c87a;">Paradise</span>
            </div>
            <a class="back-button" href="index.html">←Back</a>
        </div>

        <h1 class="title" id="tripTitle"></h1>
        <p class="subtitle" id="tripInfo"></p>
        <p class="ai-note" id="aiNote"></p>
        <div class="trip-error-banner" id="tripError" role="alert"></div>

        <div class="toolbar">
            <button class="action-button" id="regenBtn">Regenerate itinerary</button>
            <button class="action-button" id="pdfBtn">Download plan as PDF</button>
        </div>

        <div id="itinerary"></div>

        <div class="map-card" style="margin-top: 30px;">
            <div class="section-label">Map Preview</div>
            <div class="map-wrap">
                <iframe
                    id="mapFrame"
                    loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade"
                    allowfullscreen
                ></iframe>
            </div>
        </div>

        <div class="cost-box" id="costBox"></div>

        <p class="notice">
            Images are fetched from Unsplash based on the place and city. If storage is unavailable,
            the page loads demo trip data so the layout still works.
        </p>
    </div>

    <script>
        // Unsplash API access key used to fetch destination images.
        const ACCESS_KEY = "bGwMMo8FaJFfZcEvpl0QfMQ9UrLmbcNzHbNt9h3afRA";

        // Stores already-fetched images so the same request is not made twice.
        const imageCache = new Map();

        // Fallback image shown when the API does not return a result.
        const fallbackImage =
            "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80";

        // Main trip data source. Uses saved data if available, otherwise falls back to demo data.
        let data = getStoredTripData() || {
            city: "Paris",
            days: 3,
            budget: 1200
        };

        // Last successful itinerary from /generate (used for PDF without re-fetching).
        let lastItinerary = null;

        // Reads trip data from localStorage.
        function getStoredTripData() {
            try {
                const raw = localStorage.getItem("tripData");
                return raw ? JSON.parse(raw) : null;
            } catch (error) {
                console.warn("Storage unavailable:", error);
                return null;
            }
        }

        // Converts a numeric budget into a travel style tier.
        function getLuxuryLevel(budget) {
            budget = Number(budget) || 0;

            if (budget > 2000) return "luxury";
            if (budget > 1000) return "standard";
            return "budget";
        }

        function showTripError(message) {
            const banner = document.getElementById("tripError");
            if (!banner) return;

            if (message) {
                banner.innerHTML = `<strong>Could not generate itinerary.</strong> ${message}`;
                banner.classList.add("visible");
            } else {
                banner.textContent = "";
                banner.classList.remove("visible");
            }
        }

        function escapeHtml(value) {
            return String(value || "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        // Generates the itinerary using the Flask /generate API (same origin on Render).
        async function generateItinerary(city, days, budget) {
            const response = await fetch("/generate", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ city, budget, days }),
            });

            let payload = {};
            const raw = await response.text();

            if (raw) {
                try {
                    payload = JSON.parse(raw);
                } catch (error) {
                    throw new Error("The server returned a response the page could not read.");
                }
            }

            if (!response.ok) {
                throw new Error(payload.error || "Failed to generate itinerary from AI.");
            }

            const plan = Array.isArray(payload.days) ? payload.days : [];
            if (!plan.length) {
                throw new Error("The AI returned an empty itinerary. Please try again.");
            }

            const level = payload.level || getLuxuryLevel(budget);
            const destination = payload.destination || city;

            return { level, plan, destination };
        }

        // Fetches an image for a place from Unsplash and caches the result.
        async function getImage(place, city) {
            const safePlace = String(place || "travel destination").trim() || "travel destination";
            const safeCity = String(city || "city").trim() || "city";
            const cacheKey = `${safePlace}::${safeCity}`;

            if (imageCache.has(cacheKey)) {
                return imageCache.get(cacheKey);
            }

            const query = `${safePlace} ${safeCity}`.trim();
            const url = `https://api.unsplash.com/search/photos?query=${encodeURIComponent(query)}&per_page=1&orientation=landscape&client_id=${ACCESS_KEY}`;

            try {
                const response = await fetch(url, {
                    headers: {
                        "Accept-Version": "v1"
                    }
                });

                if (!response.ok) {
                    throw new Error(`Unsplash request failed with ${response.status}`);
                }

                const result = await response.json();
                const imageUrl = result?.results?.[0]?.urls?.small || fallbackImage;

                imageCache.set(cacheKey, imageUrl);
                return imageUrl;
            } catch (error) {
                console.error("Image fetch failed:", query, error);
                imageCache.set(cacheKey, fallbackImage);
                return fallbackImage;
            }
        }

        // Returns a small label based on the selected trip level.
        function createTag(level) {
            if (level === "luxury") return "Premium pick";
            if (level === "standard") return "Balanced pick";
            return "Budget-friendly";
        }

        // Enables or disables a button while showing a loading message.
        function setLoading(isLoading, target, label) {
            target.disabled = isLoading;
            target.innerHTML = isLoading
                ? `<span class="loading-spinner"></span>${label}`
                : label;
        }

        // Shows or hides the loading overlay
        function hideLoading() {
            const overlay = document.getElementById('loadingOverlay');
            if (overlay) {
                overlay.classList.add('hidden');
            }
        }

        // Renders the whole itinerary UI, including map, budget, and images.
        async function renderItinerary() {
            const city = String(data.city || "Paris");
            const days = Math.max(1, parseInt(data.days, 10) || 1);
            const budget = Number(data.budget) || 1200;

            document.getElementById("tripTitle").textContent = `Trip to ${city}`;
            document.getElementById("tripInfo").textContent = `${days} day trip planned within $${budget}`;

            const itineraryDiv = document.getElementById("itinerary");
            itineraryDiv.innerHTML = "";
            showTripError("");

            let level;
            let plan;
            let destination = city;

            try {
                const result = await generateItinerary(city, days, budget);
                level = result.level;
                plan = result.plan;
                destination = result.destination || city;
                lastItinerary = { level, plan, destination, city, days, budget };
            } catch (error) {
                console.error("AI generation failed:", error);
                showTripError(
                    `${error.message || "Please check your connection and try Regenerate."} ` +
                    "If this persists on Render, confirm GROQ_API_KEY is set in Environment."
                );
                itineraryDiv.innerHTML = `
                    <div class="error-box">
                        <h2 style="margin-top:0;">No itinerary yet</h2>
                        <p>We could not reach the AI planner. Use <strong>Regenerate itinerary</strong> to try again.</p>
                    </div>
                `;
                document.getElementById("aiNote").textContent = "Itinerary unavailable — generation failed.";
                hideLoading();
                return;
            }

            document.getElementById("aiNote").textContent =
                `AI-generated itinerary for ${destination} (${level.charAt(0).toUpperCase() + level.slice(1)} style).`;

            document.getElementById("costBox").innerHTML =
                `<strong>Estimated Budget:</strong> $${budget}<br>` +
                `Travel mode: ${level}<br>` +
                `Includes stay, food, and travel.`;

            document.getElementById("mapFrame").src =
                `https://www.google.com/maps?q=${encodeURIComponent(destination)}&output=embed`;

            const slots = ["Morning", "Afternoon", "Evening"];
            const pending = [];

            plan.forEach((day, dayIndex) => {
                const blocks = [];

                day.forEach((place, placeIndex) => {
                    if (placeIndex < slots.length) {
                        const blockId = `img-${dayIndex}-${placeIndex}`;

                        pending.push({ blockId, place, destination });

                        blocks.push(`
                            <div class="time-block loading" id="${blockId}">
                                <div class="time-label">${slots[placeIndex]}</div>
                                <div class="place-card">
                                    <img src="${fallbackImage}" alt="${escapeHtml(place)}" loading="lazy">
                                    <div class="place-copy">
                                        <div class="place-name">${escapeHtml(place)}</div>
                                        <span class="place-tag">${createTag(level)}</span>
                                    </div>
                                </div>
                            </div>
                        `);
                    }
                });

                itineraryDiv.insertAdjacentHTML(
                    "beforeend",
                    `
                    <div class="day-card">
                        <div class="day-title">Day ${dayIndex + 1}</div>
                        <div class="timeline">${blocks.join("")}</div>
                    </div>
                    `
                );
            });

            await Promise.all(
                pending.map(async ({ blockId, place, destination: mapCity }) => {
                    const imageUrl = await getImage(place, mapCity || destination || city);
                    const block = document.getElementById(blockId);

                    if (!block) return;

                    const img = block.querySelector("img");

                    if (img) {
                        img.src = imageUrl;
                        img.onerror = () => {
                            img.src = fallbackImage;
                        };
                    }

                    block.classList.remove("loading");
                })
            );

            // Hide loading overlay after content is rendered
            hideLoading();
        }

        // Slightly changes the budget and re-renders the itinerary.
        async function regenerate() {
            const btn = document.getElementById("regenBtn");
            setLoading(true, btn, "Regenerating...");

            try {
                imageCache.clear();
                data = {
                    ...data,
                    budget: Math.max(
                        300,
                        Math.round((Number(data.budget) || 1200) * (0.85 + Math.random() * 0.3))
                    )
                };

                await renderItinerary();
            } finally {
                setLoading(false, btn, "Regenerate itinerary");
            }
        }

        // Converts the visible trip plan into a downloadable PDF.
        // Converts Google Maps embed URL to a Static Maps API URL
        async function downloadPDF() {
            const btn = document.getElementById("pdfBtn");
            setLoading(true, btn, "Preparing PDF...");

            try {
                const city = String(data.city || "Paris");
                const days = Math.max(1, parseInt(data.days, 10) || 1);
                const budget = Number(data.budget) || 1200;
                const level = getLuxuryLevel(budget);

                // Create simple text content for PDF
                let pdfText = `${city.toUpperCase()} ITINERARY\n`;
                pdfText += `${'='.repeat(40)}\n\n`;
                pdfText += `Trip Duration: ${days} days\n`;
                pdfText += `Budget: $${budget}\n`;
                pdfText += `Travel Style: ${level.charAt(0).toUpperCase() + level.slice(1)}\n\n`;
                pdfText += `${'='.repeat(40)}\n\n`;

                let plan;
                if (lastItinerary && lastItinerary.plan) {
                    plan = lastItinerary.plan;
                } else {
                    const generated = await generateItinerary(city, days, budget);
                    plan = generated.plan;
                }

                const slots = ["Morning", "Afternoon", "Evening"];

                plan.forEach((dayPlaces, dayIndex) => {
                    pdfText += `DAY ${dayIndex + 1}\n`;
                    pdfText += `${'-'.repeat(40)}\n`;
                    
                    dayPlaces.forEach((place, placeIndex) => {
                        if (placeIndex < slots.length) {
                            pdfText += `${slots[placeIndex]}: ${place}\n`;
                        }
                    });
                    
                    pdfText += `\n`;
                });

                pdfText += `${'='.repeat(40)}\n`;
                pdfText += `Estimated Budget: $${budget}\n`;
                pdfText += `Includes stay, food, and travel.\n\n`;
                pdfText += `Generated by Traveller's Paradise\n`;

                // Create PDF using jsPDF
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({
                    orientation: "portrait",
                    unit: "mm",
                    format: "a4"
                });

                const pageWidth = pdf.internal.pageSize.getWidth();
                const pageHeight = pdf.internal.pageSize.getHeight();
                const margin = 15;
                const maxWidth = pageWidth - (2 * margin);
                const lineHeight = 7;
                let yPosition = margin;

                // Set font and colors
                pdf.setFont("helvetica");
                pdf.setFillColor(8, 8, 16); // Dark background color
                pdf.rect(0, 0, pageWidth, pageHeight, "F");
                pdf.setTextColor(242, 237, 230); // Light text color

                // Split text into lines and add to PDF
                const lines = pdfText.split("\n");
                lines.forEach((line) => {
                    if (yPosition > pageHeight - margin) {
                        pdf.addPage();
                        pdf.setFillColor(8, 8, 16);
                        pdf.rect(0, 0, pageWidth, pageHeight, "F");
                        pdf.setTextColor(242, 237, 230);
                        yPosition = margin;
                    }

                    if (line.includes("ITINERARY")) {
                        pdf.setFont("helvetica", "bold");
                        pdf.setFontSize(18);
                    } else if (line.includes("DAY")) {
                        pdf.setFont("helvetica", "bold");
                        pdf.setFontSize(14);
                        pdf.setTextColor(232, 200, 122); // Accent color
                    } else if (line.match(/^(Morning|Afternoon|Evening):/)) {
                        pdf.setFont("helvetica", "bold");
                        pdf.setFontSize(11);
                        pdf.setTextColor(232, 200, 122);
                    } else {
                        pdf.setFont("helvetica", "normal");
                        pdf.setFontSize(10);
                        pdf.setTextColor(242, 237, 230);
                    }

                    if (line.trim()) {
                        const wrappedLines = pdf.splitTextToSize(line, maxWidth);
                        wrappedLines.forEach((wrappedLine) => {
                            pdf.text(wrappedLine, margin, yPosition);
                            yPosition += lineHeight;
                        });
                    } else {
                        yPosition += lineHeight / 2;
                    }
                });

                // Save the PDF
                pdf.save(`${city.toLowerCase().replace(/\s+/g, "-")}-itinerary.pdf`);
                
            } catch (error) {
                console.error("PDF generation error:", error);
                alert("Error generating PDF. Check console for details.");
            } finally {
                const btn = document.getElementById("pdfBtn");
                btn.disabled = false;
                btn.textContent = "Download plan as PDF";
            }
        }

        // Button event bindings.
        document.getElementById("regenBtn").addEventListener("click", regenerate);
        document.getElementById("pdfBtn").addEventListener("click", downloadPDF);

        // Initial page render with fallback error handling.
        renderItinerary().catch(error => {
            console.error(error);
            document.body.innerHTML = `
                <div class="error-box">
                    <h2>Something went wrong</h2>
                    <p>The itinerary could not be rendered. Check the console for details.</p>
                </div>
            `;
        });
    </script>
</body>
</html>
